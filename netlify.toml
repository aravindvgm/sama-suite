# Netlify build configuration for SAMA-SUITE Angular frontend

[build]
  base = "frontend"
  command = "npm run build"
  publish = "frontend/dist/frontend/browser"

[build.environment]
  NODE_VERSION = "20"

# Angular SPA routing support
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"